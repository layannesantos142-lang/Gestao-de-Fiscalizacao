# Mantém o Supabase do Fiscalização + (plano gratuito) sempre ativo: 2x por dia grava um sinal
# de atividade no banco, nos servidores do GitHub (não depende de nenhum computador ligado).
# Assim o projeto nunca chega aos 7 dias sem uso que causam a pausa.
# Se o sinal falhar, o GitHub envia e-mail de falha para a dona do repositório.
name: Manter Supabase ativo

on:
  schedule:
    - cron: '23 11 * * *'     # todo dia, por volta das 08h23 (Brasília)
    - cron: '53 23 * * *'     # e de novo às 20h53, caso o GitHub atrase ou pule a execução da manhã
  workflow_dispatch:           # permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  manter-ativo:
    runs-on: ubuntu-latest
    steps:
      - name: Sinal de atividade no Supabase
        run: |
          for tentativa in 1 2 3; do
            codigo=$(curl -sS -o resposta.json -w "%{http_code}" -X POST \
              "https://dtbkfbwlfpwcgqykxvcz.supabase.co/rest/v1/rpc/manter_ativo" \
              -H "apikey: sb_publishable_jKbcVjcW4rh359NH-oqX3w_L-FAbxRE" \
              -H "Content-Type: application/json" \
              -d '{"p_origem":"github-actions"}' || echo 000)
            cat resposta.json 2>/dev/null; echo " (HTTP $codigo)"
            if [ "$codigo" -ge 200 ] && [ "$codigo" -lt 300 ]; then exit 0; fi
            sleep 60
          done
          echo "Falha ao contatar o Supabase. Verifique se o projeto foi pausado."; exit 1

      # O GitHub desliga rotinas agendadas de repositórios públicos sem nenhuma alteração por 60 dias.
      # Este passo registra a data do último sinal no repositório (1x por semana) para que isso nunca aconteça.
      - uses: actions/checkout@v4
      - name: Registrar data do último sinal
        run: |
          if [ -f ultimo-sinal-supabase.txt ] && [ $(( $(date +%s) - $(date -d "$(cat ultimo-sinal-supabase.txt)" +%s) )) -lt 604800 ]; then
            echo "Registro semanal já feito em $(cat ultimo-sinal-supabase.txt)"; exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > ultimo-sinal-supabase.txt
          git config user.name "manter-ativo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ultimo-sinal-supabase.txt
          git commit -m "Manter Supabase ativo: sinal de $(date -u +%d/%m/%Y)" || exit 0
          git push

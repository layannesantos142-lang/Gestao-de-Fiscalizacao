<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Fiscaliza+ &#8212; Gest&#227;o de Fiscaliza&#231;&#227;o | Ferreira Costa</title>
<style>
:root{
  --bg:#F7F6F4;--card:#FFF;--warm:#F2EFEB;--red:#bd2335;--red-l:rgba(189,35,53,.08);
  --green:#5f7a45;--green-l:rgba(95,122,69,.11);--slate:#4c525b;--slate-l:rgba(76,82,91,.09);
  --amber:#a8811f;--amber-l:rgba(168,129,31,.12);--blue:#536f8a;--blue-l:rgba(83,111,138,.12);
  --txt:#191919;--txt2:#585858;--txt3:#8e8e8e;
  --bdr:rgba(0,0,0,.08);--bdr2:rgba(0,0,0,.14);--sh:0 1px 2px rgba(0,0,0,.05);--shm:0 8px 30px rgba(0,0,0,.12)
}
body.dark{
  --bg:#131315;--card:#1D1D21;--warm:#252529;--green:#93ad76;--slate:#a1a7b0;--amber:#d0aa4e;
  --blue:#86a5c0;--txt:#EEE;--txt2:#a6a6a6;--txt3:#747474;
  --bdr:rgba(255,255,255,.08);--bdr2:rgba(255,255,255,.15);--sh:0 1px 2px rgba(0,0,0,.3);--shm:0 8px 30px rgba(0,0,0,.5)
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:hidden}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}

/* ===== Topo ===== */
.top{background:var(--card);border-bottom:2px solid var(--red);position:sticky;top:0;z-index:50}
.top-in{max-width:1320px;margin:0 auto;padding:.7rem 1.4rem;display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap}
.top .ttl{display:flex;flex-direction:column;line-height:1.2;padding-left:1rem;border-left:1px solid var(--bdr)}
.top .ttl b{font-size:1rem}.top .ttl span{font-size:.66rem;color:var(--txt3);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.perfis{margin-left:auto;display:flex;gap:.3rem;background:var(--warm);padding:.3rem;border-radius:12px}
.perfis button{border:none;background:transparent;padding:.5rem .95rem;border-radius:9px;font-size:.8rem;font-weight:700;color:var(--txt2);cursor:pointer;display:flex;align-items:center;gap:.45rem}
.perfis button i{width:9px;height:9px;border-radius:50%;display:inline-block}
.perfis button.on{background:var(--card);color:var(--txt);box-shadow:var(--sh)}
.btn-dark{border:1px solid var(--bdr2);background:var(--card);border-radius:9px;padding:.45rem .7rem;font-size:.74rem;font-weight:600;color:var(--txt2);cursor:pointer}
.aviso{max-width:1320px;margin:.8rem auto 0;padding:0 1.4rem}
.aviso div{font-size:.7rem;color:var(--txt2);background:var(--amber-l);border:1px solid rgba(168,129,31,.25);border-radius:8px;padding:.45rem .8rem}
.aviso b{color:var(--txt)}

/* ===== Layout ===== */
.app{max-width:1320px;margin:0 auto;padding:1rem 1.4rem 3rem;display:grid;grid-template-columns:230px 1fr;gap:1.2rem;align-items:start}
.side{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:.9rem;position:sticky;top:84px;box-shadow:var(--sh)}
.who{display:flex;gap:.6rem;align-items:center;padding:.3rem .2rem .85rem;border-bottom:1px solid var(--bdr);margin-bottom:.6rem}
.av{width:36px;height:36px;border-radius:10px;color:#fff;font-weight:800;font-size:.8rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.who b{font-size:.82rem;display:block;line-height:1.2}.who span{font-size:.68rem;color:var(--txt3)}
.nav button{width:100%;text-align:left;border:none;background:transparent;padding:.6rem .7rem;border-radius:8px;font-size:.8rem;font-weight:600;color:var(--txt2);cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin-bottom:.15rem}
.nav button:hover{background:var(--warm)}
.nav button.on{background:var(--red-l);color:var(--red)}
.p-juridico .nav button.on{background:var(--blue-l);color:var(--blue)}
.p-compliance .nav button.on{background:var(--green-l);color:var(--green)}
.nav .cnt{font-size:.62rem;font-weight:800;background:var(--red);color:#fff;border-radius:20px;padding:.05rem .45rem}
.side .papel{margin-top:.8rem;padding-top:.8rem;border-top:1px solid var(--bdr);font-size:.68rem;color:var(--txt2);line-height:1.45}
.side .papel b{display:block;color:var(--txt);font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.2rem}

.main{min-width:0}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
.ph h2{font-size:1.35rem;letter-spacing:-.02em}.ph p{font-size:.78rem;color:var(--txt2)}
.lbl{font-size:.64rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--txt3);margin:1.4rem 0 .7rem;display:flex;align-items:center;gap:.6rem}
.lbl::before{content:"";width:18px;height:2px;background:var(--red)}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:12px;box-shadow:var(--sh);padding:1.1rem 1.2rem}
.card+.card{margin-top:1rem}
.card h3{font-size:.9rem;margin-bottom:.15rem}.card .sub{font-size:.7rem;color:var(--txt3);margin-bottom:.8rem}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;margin-bottom:1rem}
.kpi{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:1rem 1.1rem;box-shadow:var(--sh)}
.kpis.k5{grid-template-columns:repeat(5,1fr)}
.kpi .v{font-size:1.9rem;font-weight:700;line-height:1;letter-spacing:-.02em}
.kpi .l{font-size:.72rem;color:var(--txt2);margin-top:.45rem;font-weight:500}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--bdr2)}

/* Bot&#245;es */
.btn{border:1px solid var(--bdr2);background:var(--card);border-radius:9px;padding:.55rem .95rem;font-size:.78rem;font-weight:700;cursor:pointer;color:var(--txt)}
.btn:hover{background:var(--warm)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.sm{padding:.35rem .65rem;font-size:.7rem}
.btns{display:flex;gap:.5rem;flex-wrap:wrap}

/* Tabelas */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.76rem;min-width:640px}
.t th{background:var(--warm);padding:.55rem .7rem;text-align:left;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--txt3);border-bottom:2px solid var(--bdr)}
.t td{padding:.6rem .7rem;border-bottom:1px solid var(--bdr);color:var(--txt2);vertical-align:middle}
.t td b{color:var(--txt)}
.t tr.row{cursor:pointer}.t tr.row:hover td{background:var(--warm)}
.empty{padding:1.2rem;text-align:center;font-size:.78rem;color:var(--txt3)}

.badge{display:inline-block;font-size:.58rem;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:.22rem .5rem;border-radius:5px;white-space:nowrap}
.b-aberto{background:var(--red-l);color:var(--red)}
.b-analise{background:var(--blue-l);color:var(--blue)}
.b-aguard_filial{background:var(--amber-l);color:var(--amber)}
.b-respondido{background:var(--slate-l);color:var(--slate)}
.b-encerrado{background:var(--green-l);color:var(--green)}
.tag{display:inline-block;font-size:.62rem;font-weight:600;padding:.15rem .45rem;border-radius:20px;background:var(--warm);border:1px solid var(--bdr);color:var(--txt2);margin:.1rem .15rem .1rem 0;white-space:nowrap}
.tag.apr{background:var(--red-l);color:var(--red);border-color:rgba(189,35,53,.2)}
.tag.not{background:var(--amber-l);color:var(--amber);border-color:rgba(168,129,31,.25)}
.tag.mul{background:#7B0B18;color:#fff;border-color:#7B0B18}
.tag.sem{background:var(--slate-l);color:var(--slate)}
.prazo{font-weight:700;white-space:nowrap}
.prazo.venc{color:var(--red)}.prazo.urg{color:var(--amber)}.prazo.ok{color:var(--txt2)}

/* Formul&#225;rio */
.form-sec{border-top:1px solid var(--bdr);padding-top:1rem;margin-top:1rem}
.form-sec:first-child{border-top:none;padding-top:0;margin-top:0}
.form-sec h4{font-size:.8rem;margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
.form-sec h4 .n{width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font-size:.62rem;display:flex;align-items:center;justify-content:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.8rem}
.f label{display:block;font-size:.68rem;font-weight:700;color:var(--txt2);margin-bottom:.3rem}
.f label .req{color:var(--red)}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--bdr2);background:var(--card);border-radius:8px;padding:.55rem .65rem;font-size:.8rem}
.f textarea{min-height:70px;resize:vertical}
.f .hint{font-size:.64rem;color:var(--txt3);margin-top:.25rem}
.chk{display:flex;flex-wrap:wrap;gap:.4rem}
.chk label{display:flex;align-items:center;gap:.4rem;font-size:.74rem;font-weight:600;color:var(--txt2);border:1px solid var(--bdr2);border-radius:20px;padding:.35rem .7rem;cursor:pointer;background:var(--card);margin:0}
.chk input{width:auto;accent-color:var(--red)}
.chk label.on{background:var(--red-l);border-color:rgba(189,35,53,.35);color:var(--red)}
.cond{display:none;margin-top:.7rem;background:var(--warm);border-radius:10px;padding:.8rem}
.cond.show{display:block}

/* Detalhe */
.det-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.det-head h2{font-size:1.2rem}.det-head p{font-size:.76rem;color:var(--txt2)}
.id-chamado{display:inline-flex;align-items:center;flex-wrap:wrap;gap:.35rem .55rem;margin-top:.7rem;background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:.35rem .7rem}
.id-chamado span{font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--txt2)}.id-chamado b{font-size:.95rem;font-family:Consolas,monospace;margin-right:.4rem}
.det{display:grid;grid-template-columns:1.35fr 1fr;gap:1rem;align-items:start}
.info{display:grid;grid-template-columns:1fr 1fr;gap:.7rem 1rem}
.info div span{display:block;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--txt3)}
.info div b{font-size:.8rem;font-weight:600}
.info .full{grid-column:1/-1}
.info .full p{font-size:.78rem;color:var(--txt2)}
.box{background:var(--warm);border-radius:9px;padding:.7rem .85rem;font-size:.75rem;color:var(--txt2);margin-top:.8rem}
.box b{color:var(--txt)}
.box.multa{background:rgba(123,11,24,.07);border-left:3px solid #7B0B18}
.pbanner{display:grid;grid-template-columns:1fr 1.4fr;gap:.8rem;margin-bottom:1rem}
.pbanner>div{border-radius:12px;padding:.85rem 1.1rem;border:1px solid var(--bdr);background:var(--card);border-left:5px solid var(--txt3);display:flex;flex-direction:column;gap:.1rem;box-shadow:var(--sh)}
.pbanner span{font-size:.6rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--txt3)}
.pbanner b{font-size:1.25rem;letter-spacing:-.01em}
.pbanner .pb-ret b{font-size:1rem}
.pbanner em{font-style:normal;font-size:.74rem;font-weight:700}
.pbanner .venc{border-left-color:var(--red);background:var(--red-l)}.pbanner .venc em,.pbanner .venc b{color:var(--red)}
.pbanner .urg{border-left-color:var(--amber);background:var(--amber-l)}.pbanner .urg em{color:var(--amber)}
.pbanner .ok{border-left-color:var(--green)}.pbanner .ok em{color:var(--green)}
.pbanner .sem{border-left-color:var(--amber);border-style:dashed}.pbanner .sem em{color:var(--amber)}
.prazo.okv{color:var(--green)}
.seta{font-weight:700}.seta.filial{color:var(--red)}.seta.juridico{color:var(--blue)}
.fr .t tr.org td{background:var(--warm);border-top:2px solid var(--bdr2)}
.card.fr{margin-bottom:1rem}
@media(max-width:640px){.pbanner{grid-template-columns:1fr}}
.env{font-size:.7rem;color:var(--txt2);background:var(--warm);border-radius:8px;padding:.45rem .65rem}
.env b{color:var(--txt)}
.env.ult{background:var(--amber-l);color:var(--amber)}.env.ult b{color:var(--amber)}
.env.bloq{background:var(--red-l);color:var(--txt2);border-left:3px solid var(--red);line-height:1.5}.env.bloq b{color:var(--red)}
.pend-lista{display:flex;flex-direction:column;gap:.7rem}
.anx{display:flex;flex-wrap:wrap;align-items:baseline;gap:.2rem .7rem;padding:.45rem 0;border-bottom:1px solid var(--bdr)}
.anx span{font-size:.68rem;color:var(--txt2)}
.lnk{background:none;border:0;padding:0;color:var(--blue);font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;text-align:left}.lnk:hover{text-decoration:underline}
input[type=file]{font-size:.78rem;padding:.45rem;border:1px dashed var(--bdr);border-radius:10px;width:100%;background:var(--card)}
.pend-card{border:1px solid rgba(168,129,31,.35);border-left:5px solid var(--amber);background:var(--amber-l);border-radius:12px;padding:.85rem 1rem;cursor:pointer;transition:transform .12s, box-shadow .12s}
.pend-card:hover{transform:translateY(-1px);box-shadow:var(--shm)}
.pend-card.venc{border-color:rgba(189,35,53,.35);border-left-color:var(--red);background:var(--red-l)}
.pend-card .pc-top{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;font-size:.86rem}
.pend-card .pc-pedido{font-size:.8rem;color:var(--txt);margin:.45rem 0 .55rem;line-height:1.45}
.pend-card .pc-pedido span{font-weight:700;color:var(--txt2)}
.pend-card .pc-rod{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;font-size:.72rem;color:var(--txt2)}
.pop-lembrete{background:var(--amber-l);border:1px solid rgba(168,129,31,.3);border-left:5px solid var(--amber);border-radius:12px;padding:.85rem 1.1rem;margin-bottom:1rem;font-size:.8rem;color:var(--txt)}
.pop-lembrete ul{margin:.4rem 0 0 1.1rem;display:grid;grid-template-columns:1fr 1fr;gap:.2rem 1.4rem;color:var(--txt2)}
@media(max-width:640px){.pop-lembrete ul{grid-template-columns:1fr}}
.ml-box{margin-top:.7rem;padding-top:.7rem;border-top:1px dashed var(--bdr2)}
.box.ml{background:var(--amber-l);border-left:3px solid var(--amber)}
.box.ml.confirmada{background:rgba(123,11,24,.07);border-left-color:#7B0B18}
.box.ml.nao_aplicada{background:var(--slate-l);border-left-color:var(--slate)}
.ml-acao{background:var(--amber-l);border:1px solid rgba(168,129,31,.3);border-radius:10px;padding:.8rem;margin-bottom:.9rem}
.ml-acao h4{margin-top:0 !important}

/* Linha do tempo */
.tl{position:relative;padding-left:1.1rem}
.tl::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--bdr)}
.ev{position:relative;padding:.1rem 0 .85rem}
.ev::before{content:"";position:absolute;left:-1.1rem;top:.35rem;width:12px;height:12px;border-radius:50%;background:var(--card);border:3px solid var(--txt3)}
.ev.filial::before{border-color:var(--red)}.ev.juridico::before{border-color:var(--blue)}.ev.compliance::before{border-color:var(--green)}
.ev .eh{font-size:.64rem;color:var(--txt3);font-weight:600}
.ev .eh b{font-size:.6rem;text-transform:uppercase;letter-spacing:.06em}
.ev.filial .eh b{color:var(--red)}.ev.juridico .eh b{color:var(--blue)}.ev.compliance .eh b{color:var(--green)}
.ev .et{font-size:.76rem;color:var(--txt);margin-top:.1rem}
.ev.compliance .et{background:var(--green-l);border-radius:8px;padding:.45rem .6rem}

.acoes .f{margin-bottom:.6rem}
.acoes h4{font-size:.78rem;margin:.9rem 0 .5rem}
.acoes h4:first-child{margin-top:0}

/* Painel Compliance */
.foco-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.foco-card .n{width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font-size:.66rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center;margin-right:.4rem}
.foco-card h3{display:flex;align-items:center;font-size:.84rem}
.bar-row{display:grid;grid-template-columns:120px 1fr 34px;gap:.6rem;align-items:center;margin:.45rem 0;font-size:.72rem}
.bar-row .nm{color:var(--txt2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;background:var(--warm);border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;border-radius:20px;background:var(--red)}
.bar-row .nu{text-align:right;font-weight:700}
.multa-list{font-size:.7rem;color:var(--txt2);margin-top:.6rem;border-top:1px solid var(--bdr);padding-top:.5rem}
.multa-list div{padding:.2rem 0}

.filters{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem}
.filters select,.filters input{border:1px solid var(--bdr2);background:var(--card);border-radius:8px;padding:.45rem .6rem;font-size:.76rem}

.cad{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.cad ul{list-style:none;margin:.4rem 0 .7rem}
.cad li{display:flex;justify-content:space-between;align-items:center;padding:.4rem .2rem;border-bottom:1px solid var(--bdr);font-size:.76rem}
.cad li button{border:none;background:none;color:var(--txt3);cursor:pointer;font-size:.9rem}
.cad li button:hover{color:var(--red)}
.cad .add{display:flex;gap:.4rem}.cad .add input{flex:1;border:1px solid var(--bdr2);border-radius:8px;padding:.45rem .6rem;font-size:.76rem;background:var(--card)}

.toast{position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%) translateY(20px);background:#242428;color:#fff;padding:.7rem 1.1rem;border-radius:10px;font-size:.78rem;font-weight:600;opacity:0;transition:.25s;z-index:200;box-shadow:var(--shm);max-width:calc(100vw - 2rem)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#login{display:none}
/* ===== Tela de entrada (mesmo visual do acesso corporativo Ferreira Costa) ===== */
body.sem-login{background:#f7f7f7}
body.sem-login #login{display:block;min-height:100vh;position:relative;overflow:hidden;padding:2rem 1rem 3rem}
body.sem-login .top .perfis,body.sem-login .top .btn-dark,body.sem-login .app{display:none}
body.sem-login .top{display:none}
.lg-wrap{position:relative;z-index:1;max-width:480px;margin:0 auto}
.lg-logo{display:flex;justify-content:center;margin:.5rem 0 1.6rem}
.lg-logo img{height:84px !important;width:auto}
.login-box{background:#fff;color:#191919;border:1px solid #ececec;border-radius:16px;box-shadow:0 2px 14px rgba(0,0,0,.05);padding:2.4rem 2.5rem 2rem;width:100%}
.login-box h2{font-size:1.75rem;font-weight:800;letter-spacing:-.02em;color:#191919}
.login-box>p{font-size:.95rem;color:#585858;margin:.35rem 0 1.4rem}
.lg-selo{width:64px;height:64px;border-radius:50%;background:#c8102e;color:#fff;font-weight:800;font-size:1.05rem;display:flex;align-items:center;justify-content:center;margin:.2rem auto 1.4rem;letter-spacing:.02em}
.login-box .f label{font-size:.92rem;font-weight:600;color:#191919;margin-bottom:.45rem}
.login-box .f{margin-top:1rem}
.login-box input,.login-box select{width:100%;border:1px solid #dcdcdc;border-radius:10px;padding:.8rem .95rem;font-size:.95rem;background:#fff;color:#191919}
.login-box input:focus,.login-box select:focus{outline:none;border-color:#c8102e;box-shadow:0 0 0 3px rgba(200,16,46,.12)}
.login-box .btn.pri{padding:.85rem;font-size:.95rem;border-radius:10px;background:#c8102e;border-color:#c8102e}
.lg-rodape{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;margin-top:1rem;font-size:.76rem;color:#8e8e8e}
.lg-rodape a{color:#585858}
.lg-deco-tr{position:fixed;top:0;right:0;width:300px;pointer-events:none;z-index:0}
.lg-deco-bl{position:fixed;left:0;bottom:0;display:flex;z-index:0;pointer-events:none}
.lg-deco-bl div{width:64px;height:64px;display:flex;align-items:center;justify-content:center}

function hojeBR(){ var d = HOJE; return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear(); }
function dias(s){ return Math.round((pBR(s) - HOJE) / 864e5); }
function fmtBR(d){ return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear(); }
function addDias(s, n){ var d = pBR(s); d.setDate(d.getDate()+n); return fmtBR(d); }
// prazo de retorno interno: "desde + n dias", mas nunca depois da v\u00E9spera do prazo do \u00F3rg\u00E3o
function prazoRetorno(c, desde, n){
  var p = addDias(desde, n);
  if (c.prazo) { var vesp = addDias(c.prazo, -1); if (pBR(p) > pBR(vesp)) p = pBR(vesp) < pBR(desde) ? desde : vesp; }
  return p;
}
function pendente(c){ for (var i=c.retornos.length-1;i>=0;i--) if (!c.retornos[i].respondido) return c.retornos[i]; return null; }
function fecharPendente(c, para){ c.retornos.forEach(function(r){ if (r.para===para && !r.respondido) r.respondido = hojeBR(); }); }
var NOME_SETOR = {filial:'Filial', juridico:'Jur\u00EDdico'};
function contagem(s){ var d = dias(s); return d < 0 ? 'atrasado ' + (-d) + (d===-1?' dia':' dias') : d === 0 ? 'vence hoje' : d === 1 ? 'amanh\u00E3' : 'em ' + d + ' dias'; }
function clsDias(s){ var d = dias(s); return d < 0 ? 'venc' : d <= 2 ? 'urg' : 'ok'; }
function retornoHtml(c){
  var p = pendente(c); if (!p || c.status==='encerrado') return '<span class="prazo ok">\u2014</span>';
  return '<span class="prazo '+clsDias(p.prazo)+'">'+NOME_SETOR[p.para]+' at\u00E9 '+p.prazo.slice(0,5)+' \u00B7 '+contagem(p.prazo)+'</span>';
}
function brl(v){ return 'R$ ' + v.toLocaleString('pt-BR'); }
function toast(t){ var e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(e._t); e._t = setTimeout(function(){ e.classList.remove('show'); }, 2600); }
function byId(id){ for (var i=0;i<chamados.length;i++) if (chamados[i].id===id) return chamados[i]; }
function badge(s){ return '<span class="badge b-'+s+'">'+STATUS[s]+'</span>'; }
function tags(c){
  return c.resultados.map(function(r){ var cl = {notificacao:'not', apreensao:'apr', multa:'mul', sem_doc:'sem'}[r]; return '<span class="tag '+cl+'">'+RESULTADOS[r]+'</span>'; }).join('');
}
function prazoHtml(c){
  if (!c.prazo || c.status==='encerrado') return '<span class="prazo ok">'+(c.prazo ? c.prazo.slice(0,5) : '\u2014')+'</span>';
  if (c.status==='respondido') return '<span class="prazo okv">'+c.prazo.slice(0,5)+' \u00B7 protocolado</span>';
  var d = dias(c.prazo), cl = d < 0 ? 'venc' : d <= 3 ? 'urg' : 'ok';
  var txt = d < 0 ? 'vencido' : d === 0 ? 'hoje' : d === 1 ? 'amanh\u00E3' : 'em ' + d + ' dias';
  return '<span class="prazo '+cl+'">'+c.prazo.slice(0,5)+' \u00B7 '+txt+'</span>';
}
function autorNome(papel, filial){

}

async function carregarTudo(){
  var q = await Promise.all([
    sb.from('chamados').select('*').order('criado_em'),
    sb.from('eventos').select('*').order('criado_em'),
    sb.from('retornos').select('*').order('id'),
    sb.from('liberacoes').select('*').eq('status','pendente'),
    sb.from('multas_lojista').select('*'),
    sb.from('listas').select('*').order('ordem'),
    sb.from('filiais').select('*').eq('ativa', true).order('codigo'),
    sb.from('perfis').select('*').order('nome'),
    sb.from('anexos').select('*').order('id')
  ]);
  for (var i=0;i<q.length;i++) if (q[i].error) { erroDb(q[i].error, 'carregar'); return; }
  var mapa = {};
  chamados = q[0].data.map(function(r){ var c = deLinha(r); mapa[c.id] = c; return c; });
  q[1].data.forEach(function(e){ var c = mapa[e.chamado_id]; if (c) c.eventos.push({_id:e.id, data:br(e.criado_em), papel:e.papel, autor:e.autor, texto:e.texto}); });
  q[2].data.forEach(function(r){ var c = mapa[r.chamado_id]; if (c) c.retornos.push({_id:r.id, de:r.de, para:r.para, enviado:br(r.enviado), prazo:br(r.prazo), respondido:r.respondido ? br(r.respondido) : null, _resp0:r.respondido ? br(r.respondido) : null}); });
  q[3].data.forEach(function(l){ var c = mapa[l.chamado_id]; if (c) c.libPend = {_id:l.id, por:l.pedido_por, data:br(l.pedido_em), motivo:l.motivo}; });
  q[4].data.forEach(function(m){ var c = mapa[m.chamado_id]; if (c) { c.multaLojista = {_salvo:true, valor:+m.valor, motivo:m.motivo, status:m.status, valorFinal:m.valor_final != null ? +m.valor_final : null, obs:m.obs||''}; var x = c.multaLojista; x._snap = [x.valor, x.motivo, x.status, x.valorFinal, x.obs].join('|'); } });
  ORGAOS = q[5].data.filter(function(x){ return x.tipo==='orgao'; }).map(function(x){ return x.valor; });
  MOTIVOS = q[5].data.filter(function(x){ return x.tipo==='motivo'; }).map(function(x){ return x.valor; });
  NCS = q[5].data.filter(function(x){ return x.tipo==='nc'; }).map(function(x){ return x.valor; });
  SETORES = q[5].data.filter(function(x){ return x.tipo==='setor'; }).map(function(x){ return x.valor; });
  FILIAIS_TODAS = q[6].data.map(function(f){ return f.codigo; });
  FILIAIS = q[6].data.filter(function(f){ return f.loja !== false; }).map(function(f){ return f.codigo; });
  FILIAL_NOME = {}; q[6].data.forEach(function(f){ FILIAL_NOME[f.codigo] = f.nome || ''; });
  PERFIS = q[7].data;
  q[8].data.forEach(function(a){ var c = mapa[a.chamado_id]; if (c) c.anexos.push(a); });
}

// ---------- Anexos (Supabase Storage, bucket privado "anexos"; nada \u00E9 apagado) ----------
var CAT_ANEXO = {geral:'Anexo', abertura:'Abertura do chamado', resposta_filial:'Resposta da filial', mall:'Loja do Mall', juridico:'Jur\u00EDdico'};
async function enviarAnexos(c, files, categoria){
  var ok = 0;
  for (var i=0;i<files.length;i++){
    var fl = files[i];
    if (fl.size > 20*1024*1024) { toast('"' + fl.name + '" passa de 20 MB e n\u00E3o foi enviado.'); continue; }
    var limpo = fl.name.normalize('NFD').replace(/[\u0300-\u036F]/g,'').replace(/[^\w.\-]+/g,'_');
    var caminho = c.id + '/' + Date.now() + '_' + limpo;
    var up = await sb.storage.from('anexos').upload(caminho, fl, {contentType: fl.type || 'application/octet-stream', upsert:false});
    if (up.error) { erroDb(up.error, 'anexo ' + fl.name); continue; }
    var r = await sb.from('anexos').insert({chamado_id:c.id, categoria:categoria, nome:fl.name, caminho:caminho, tamanho:fl.size, tipo:fl.type||null, papel:perfil, autor:autorNome(perfil, c.filial)}).select('*').single();
    if (r.error) { erroDb(r.error, 'anexo ' + fl.name); continue; }
    c.anexos.push(r.data); ok++;
  }
  return ok;
}
function arquivosDe(id){ var e = $(id); return e && e.files ? [].slice.call(e.files) : []; }
function nomesArq(fs){ return fs.map(function(f){ return f.name; }).join(', '); }
async function abrirAnexo(cid, aid){
  var c = byId(cid), a = c && c.anexos.filter(function(x){ return x.id === aid; })[0]; if (!a) return;
  var r = await sb.storage.from('anexos').createSignedUrl(a.caminho, 300);
  if (r.error) return erroDb(r.error, 'abrir anexo');
  window.open(r.data.signedUrl, '_blank');
}
function tamanhoTxt(n){ return !n ? '' : n < 1048576 ? Math.max(1, Math.round(n/1024)) + ' KB' : (n/1048576).toFixed(1).replace('.', ',') + ' MB'; }
function cardAnexos(c){
  var lista = c.anexos.map(function(a){
    return '<div class="anx"><button class="lnk" onclick="abrirAnexo(\'' + c.id + '\',' + a.id + ')">\uD83D\uDCCE ' + esc(a.nome) + '</button>' +
      '<span>' + esc(CAT_ANEXO[a.categoria] || a.categoria) + ' \u00B7 ' + esc(a.autor || '') + ' \u00B7 ' + br(a.criado_em) + (a.tamanho ? ' \u00B7 ' + tamanhoTxt(a.tamanho) : '') + '</span></div>';
  }).join('');
  return '<div class="card"><h3>Anexos</h3><div class="sub">Notifica\u00E7\u00E3o, auto de apreens\u00E3o, fotos e documentos \u00B7 at\u00E9 20 MB por arquivo \u00B7 anexos n\u00E3o podem ser apagados</div>' +
    (lista || '<div class="empty" style="padding:.8rem">Nenhum anexo ainda.</div>') +
    '<div class="f" style="margin-top:.7rem"><label>Adicionar anexos</label><input type="file" id="anx_' + c.id + '" multiple></div>' +
    '<div class="btns"><button class="btn" id="anxbtn_' + c.id + '" onclick="anexarNoChamado(\'' + c.id + '\')">Enviar anexo(s)</button></div></div>';
}
async function anexarNoChamado(cid){
  var c = byId(cid), fs = arquivosDe('anx_' + cid);
  if (!fs.length) return toast('Escolha pelo menos um arquivo.');
  var btn = $('anxbtn_' + cid); btn.disabled = true; btn.textContent = 'Enviando...';
  _ocupado = true;
  var n = await enviarAnexos(c, fs, perfil === 'juridico' ? 'juridico' : 'geral');
  if (n) { addEv(c, perfil, 'Anexou ' + n + ' arquivo(s): ' + nomesArq(fs)); await salvar(c); toast(n + ' anexo(s) enviado(s).'); }

}

// grava o chamado e tudo o que mudou nele (hist\u00F3rico, retornos, libera\u00E7\u00E3o, multa ao lojista)
async function salvar(c){
  try {
    var r;
    if (!c._salvo) {
      r = await sb.from('chamados').insert(paraLinha(c)).select('id').single();
      if (r.error) throw r.error;
      c.id = r.data.id; c._salvo = true;
    } else {
      r = await sb.from('chamados').update(paraLinha(c)).eq('id', c.id);
      if (r.error) throw r.error;
    }
    var novos = c.eventos.filter(function(e){ return !e._id; });
    if (novos.length) {
      r = await sb.from('eventos').insert(novos.map(function(e){ return {chamado_id:c.id, papel:e.papel, autor:e.autor, texto:e.texto}; })).select('id');
      if (r.error) throw r.error;
      novos.forEach(function(e, i){ e._id = r.data[i].id; });
    }
    for (var i=0;i<c.retornos.length;i++) {
      var t = c.retornos[i];
      if (!t._id) {
        r = await sb.from('retornos').insert({chamado_id:c.id, de:t.de, para:t.para, enviado:iso(t.enviado), prazo:iso(t.prazo), respondido:iso(t.respondido)}).select('id').single();
        if (r.error) throw r.error;
        t._id = r.data.id; t._resp0 = t.respondido;
      } else if (t.respondido !== t._resp0) {
        r = await sb.from('retornos').update({respondido:iso(t.respondido)}).eq('id', t._id);
        if (r.error) throw r.error;
        t._resp0 = t.respondido;
      }
    }
    if (c.libPend && !c.libPend._id) {
      r = await sb.from('liberacoes').insert({chamado_id:c.id, pedido_por:c.libPend.por, motivo:c.libPend.motivo}).select('id').single();
      if (r.error) throw r.error;
      c.libPend._id = r.data.id;
    }
    if (c._decisaoLib) {
      r = await sb.from('liberacoes').update({status:c._decisaoLib.status, obs:c._decisaoLib.obs||null, decidido_por:EU.id, decidido_em:new Date().toISOString()}).eq('id', c._decisaoLib.id);
      if (r.error) throw r.error;
      c._decisaoLib = null;
    }
    if (c.multaLojista) {
      var m = c.multaLojista, snap = [m.valor, m.motivo, m.status, m.valorFinal, m.obs].join('|');
      if (!m._salvo || snap !== m._snap) {
        var linha = {chamado_id:c.id, valor:m.valor, motivo:m.motivo, status:m.status, valor_final:m.valorFinal != null ? m.valorFinal : null, obs:m.obs||null, atualizado_em:new Date().toISOString()};
        r = m._salvo ? await sb.from('multas_lojista').update(linha).eq('chamado_id', c.id) : await sb.from('multas_lojista').insert(linha);
        if (r.error) throw r.error;
        m._salvo = true; m._snap = snap;
      }
    }
    return true;
  } catch (e) { erroDb(e, 'chamado ' + c.id); return false; }
}
// grava; se o banco recusar, recarrega do banco para a tela n\u00E3o mostrar algo que n\u00E3o foi salvo
function persistir(id){ var c = byId(id); if (c) { _ocupado = true; salvar(c).then(async function(ok){ _ocupado = false; if (!ok) { await carregarTudo(); render(); } }); } }

// tempo real: qualquer mudan\u00E7a no banco recarrega e atualiza a tela (sem apagar o que a pessoa est\u00E1 digitando)
function digitando(){ var a = document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.closest('#main') && (a.value || '').length > 0; }
function agendarRecarga(){
  clearTimeout(_recarga);
  _recarga = setTimeout(async function(){
    if (_ocupado || digitando() || editando || (perfil==='filial' && tela.filial==='novo' && !sel)) { agendarRecarga(); return; }
    await carregarTudo(); render();
  }, 700);
}
function ouvirMudancas(){
  var canal = sb.channel('fiscalizacao');
  ['chamados','eventos','retornos','liberacoes','multas_lojista','listas','filiais','perfis','anexos'].forEach(function(t){
    canal.on('postgres_changes', {event:'*', schema:'public', table:t}, agendarRecarga);
  });
  canal.subscribe();
}

  setTimeout(function(){ var i = $('ns_1'); if (i) i.focus(); }, 50);
}
async function salvarNovaSenha(e, obrigatoria){
  e.preventDefault();
  var s1 = $('ns_1').value, s2 = $('ns_2').value;
  if (s1.length < 8 || !/[a-zA-Z]/.test(s1) || !/\d/.test(s1)) { telaTrocaSenha(obrigatoria, 'A senha precisa ter pelo menos 8 caracteres, com letras e n\u00FAmeros.'); return false; }
  if (s1 !== s2) { telaTrocaSenha(obrigatoria, 'As duas senhas n\u00E3o s\u00E3o iguais.'); return false; }
  $('ns_btn').disabled = true; $('ns_btn').textContent = 'Salvando...';
  var r = await sb.auth.updateUser({password:s1, data:{deve_trocar_senha:false}});
  if (r.error) {
    var m = /different|same/i.test(r.error.message) ? 'A nova senha precisa ser diferente da senha provis\u00F3ria.' : /weak|short|least/i.test(r.error.message) ? 'Senha fraca: use pelo menos 8 caracteres, com letras e n\u00FAmeros.' : 'N\u00E3o foi poss\u00EDvel salvar: ' + r.error.message;
    telaTrocaSenha(obrigatoria, m); return false;
  }
  toast('Senha alterada com sucesso.');
  if (obrigatoria) iniciar(); else { document.body.classList.remove('sem-login'); render(); }
  return false;
}

async function iniciar(){
  var s = await sb.auth.getSession();
  if (!s.data.session) { telaLogin(); return; }
  var uid = s.data.session.user.id;
  var p = await sb.from('perfis').select('*').eq('id', uid).single();
  if (p.error || !p.data) { await sb.auth.signOut(); telaLogin('Esta conta ainda n\u00E3o tem perfil. Fale com o Compliance.'); return; }
  EU = p.data;
  if (EU.ativo === false) { await sb.auth.signOut(); telaLogin('Esta conta est\u00E1 desativada. Fale com o Compliance.'); return; }
  if (EU.papel === 'pendente') { await sb.auth.signOut(); telaLogin('Esta conta est\u00E1 aguardando o Compliance definir o perfil (Filial, Jur\u00EDdico ou Compliance).'); return; }
  if (EU.papel === 'filial' && !EU.filial) { await sb.auth.signOut(); telaLogin('Esta conta de Filial ainda n\u00E3o tem filial definida. Fale com o Compliance.'); return; }
  // a filial e o setor escolhidos na entrada precisam ser os da conta
  if (_escolhaLogin && (_escolhaLogin.filial !== (EU.filial||'') || _escolhaLogin.setor !== (EU.setor||''))) {
    _escolhaLogin = null; await sb.auth.signOut();
    telaLogin('Este e-mail n\u00E3o est\u00E1 cadastrado na filial e no setor escolhidos. Confira a filial e o setor ou fale com o Compliance.'); return;
  }
  _escolhaLogin = null;
  // senha provis\u00F3ria (conta nova ou senha resetada pelo Compliance): obriga a criar uma senha nova antes de usar o app
  var us = await sb.auth.getUser();
  if (us.data && us.data.user && (us.data.user.user_metadata || {}).deve_trocar_senha) { telaTrocaSenha(true); return; }
  document.body.classList.remove('sem-login');
  perfil = EU.papel; FILIAL_USUARIO = EU.filial || '';
  $('perfis').style.display = EU.papel === 'compliance' ? '' : 'none';
  await carregarTudo();
  if (EU.papel === 'compliance' && FILIAIS.indexOf(FILIAL_USUARIO) < 0) FILIAL_USUARIO = FILIAIS[0] || '';
  render(); ouvirMudancas();
}

function bindNovo(){

function enviarNovo(e){

  var orgao = g('orgao') === '__outro' ? g('orgaoOutro') : g('orgao');

  var c = mk({id:'(novo)', filial:FILIAL_USUARIO, unidade:g('unidade'), lojista: g('unidade')==='Loja do Mall' ? g('lojista') : '', obra: g('unidade')==='Obra' ? g('obra') + (g('respTec') ? ' \u00B7 RT: ' + g('respTec') : '') : '', orgao:orgao, motivo:motivo, forma:g('forma'), data:g('data'), fiscal:g('fiscal'), recebeu:g('recebeu'), acompanhou:acomp,

  c.retornos = [rt('filial','juridico', hojeBR(), prazoRetorno(c, hojeBR(), 2))];
  if (propoe) { c.multaLojista = {valor:mlv, motivo:g('mlMotivo'), status:'pendente'}; addEv(c, 'filial', 'Proposta de multa contratual ao lojista ' + c.lojista + ': ' + brl(mlv) + ' \u2014 ' + g('mlMotivo') + '. Aguardando confirma\u00E7\u00E3o do Jur\u00EDdico.'); }
  var btn = f.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Enviando...';
  var arqs = [].slice.call(f.elements.arquivos.files || []), arqMall = g('unidade')==='Loja do Mall' ? [].slice.call(f.elements.arqMall.files || []) : [];

  });

async function baixarBackup(){
  var btn = $('btn_bkp'); btn.disabled = true; btn.textContent = 'Gerando backup\u2026';

async function chamarAdmin(corpo){

  var dados = r.data;
  if (r.error) { try { dados = await r.error.context.json(); } catch (e) { dados = {erro: r.error.message}; } }
  if (!dados || dados.erro) { toast(dados && dados.erro ? dados.erro : 'Erro ao falar com o servidor.'); return null; }
  return dados;
}
async function criarConta(){
  var filial = val('nu_filial'), setor = val('nu_setor'), papel = val('nu_papel'), senha = val('nu_senha'), email = val('nu_email').toLowerCase(), nome = val('nu_nome');
  if (!filial || !setor) return toast('Escolha a filial e o setor.');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast('Informe um e-mail v\u00E1lido.');

  if (senha.length < 8 || !/[a-zA-Z]/.test(senha) || !/\d/.test(senha)) return toast('A senha provis\u00F3ria precisa ter 8+ caracteres, com letras e n\u00FAmeros.');

// senha provis\u00F3ria sugerida: letras + n\u00FAmeros, sem caracteres que confundem (0/O, 1/l)
function gerarSenha(){
  var L = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz', N = '23456789', a = new Uint32Array(10), s = '';
  crypto.getRandomValues(a);
  for (var i=0;i<10;i++) s += (i===3 || i===7 ? N : L)[a[i] % (i===3 || i===7 ? N : L).length];
  return s;
}

}

function prazoBanner(c){
  var p = pendente(c), enc = c.status==='encerrado';
  var org = c.prazo ? '<div class="pb-org '+(enc ? 'ok' : clsDias(c.prazo))+'"><span>Prazo do \u00F3rg\u00E3o</span><b>'+c.prazo+'</b><em>'+(enc ? 'caso encerrado' : contagem(c.prazo))+'</em></div>'
                    : '<div class="pb-org sem"><span>Prazo do \u00F3rg\u00E3o</span><b>N\u00E3o informado</b><em>'+(enc ? 'caso encerrado' : 'registre o prazo assim que o \u00F3rg\u00E3o informar')+'</em></div>';
  var ret = (!enc && p) ? '<div class="pb-ret '+clsDias(p.prazo)+'"><span>Retorno pendente</span><b>'+NOME_SETOR[p.para]+' deve retornar at\u00E9 '+p.prazo+'</b><em>'+contagem(p.prazo)+' \u00B7 enviado por '+NOME_SETOR[p.de]+' em '+p.enviado.slice(0,5)+'</em></div>'

  return '<div class="pbanner">'+org+ret+'</div>';
}
function fluxoRetorno(c){
  var linhas = c.retornos.map(function(r){
    var sit, cl;
    if (r.respondido) { var atras = pBR(r.respondido) > pBR(r.prazo); sit = (atras ? 'Respondido com atraso' : 'Respondido no prazo') + ' \u00B7 ' + r.respondido.slice(0,5); cl = atras ? 'venc' : 'okv'; }
    else { sit = c.status==='encerrado' ? 'Encerrado' : 'Pendente \u00B7 ' + contagem(r.prazo); cl = c.status==='encerrado' ? 'ok' : clsDias(r.prazo); }
    return '<tr><td><span class="seta '+r.de+'">'+NOME_SETOR[r.de]+'</span> \u2192 <span class="seta '+r.para+'">'+NOME_SETOR[r.para]+'</span></td><td>'+r.enviado.slice(0,5)+'</td><td><b>'+r.prazo.slice(0,5)+'</b></td><td><span class="prazo '+cl+'">'+sit+'</span></td></tr>';
  }).join('');
  var orgLinha = '<tr class="org"><td><span class="seta juridico">Jur\u00EDdico</span> \u2192 <b>\u00D3rg\u00E3o</b></td><td>\u2014</td><td><b>'+(c.prazo ? c.prazo.slice(0,5) : '\u2014')+'</b></td><td>'+
    (c.status==='respondido' || c.status==='encerrado' ? '<span class="prazo okv">Resposta protocolada</span>' : c.prazo ? '<span class="prazo '+clsDias(c.prazo)+'">Protocolar \u00B7 '+contagem(c.prazo)+'</span>' : '<span class="prazo ok">Prazo n\u00E3o informado</span>')+'</td></tr>';
  return '<div class="card fr"><h3>Fluxo de retorno entre setores</h3><div class="sub">Cada envio tem um prazo de retorno, sempre antes do prazo do \u00F3rg\u00E3o</div>' +
    '<div class="tbl-wrap"><table class="t" style="min-width:520px"><thead><tr><th>Envio</th><th>Enviado em</th><th>Retornar at\u00E9</th><th>Situa\u00E7\u00E3o</th></tr></thead><tbody>'+linhas+orgLinha+'</tbody></table></div></div>';
}
var ML_ST = {pendente:'Aguardando confirma\u00E7\u00E3o do Jur\u00EDdico', confirmada:'Confirmada pelo Jur\u00EDdico', nao_aplicada:'N\u00E3o aplicada'};
function mlBox(c){

    '<br>Situa\u00E7\u00E3o: <b>'+ML_ST[m.status]+'</b>' + (m.obs ? '<br>Observa\u00E7\u00E3o do Jur\u00EDdico: '+esc(m.obs) : '') + '</div>';

    '<div class="g2"><div class="f"><label>Valor confirmado</label><input id="ml_v" value="'+m.valor.toLocaleString('pt-BR')+'"></div>' +
    '<div class="f"><label>Base contratual</label><select id="ml_base"><option>Cl\u00E1usula 22.2</option><option>Cl\u00E1usula 22.3</option><option>Cl\u00E1usulas 22.2 e 22.3</option></select></div></div>' +
    '<div class="f"><label>Observa\u00E7\u00E3o (obrigat\u00F3ria se n\u00E3o aplicar)</label><textarea id="ml_obs" placeholder="Ex.: notificar o lojista para regularizar antes da multa"></textarea></div>' +
    '<div class="btns"><button class="btn blue" onclick="acao(\''+c.id+'\',\'ml_ok\')">Confirmar e aplicar multa</button><button class="btn" onclick="acao(\''+c.id+'\',\'ml_nao\')">N\u00E3o aplicar</button></div></div>';
}
// ----- Regra de envios Filial <-> Jur\u00EDdico (2 por lado; depois, libera\u00E7\u00E3o do Compliance) -----
var LADO = {filial:'Filial \u2192 Jur\u00EDdico', juridico:'Jur\u00EDdico \u2192 Filial'};
function podeEnviar(c, lado){ return c.envios[lado] < c.limite; }
function contador(c, lado){
  var usados = c.envios[lado], rest = c.limite - usados;
  return '<div class="env '+(rest<=1?'ult':'')+'">Envios '+LADO[lado]+': <b>'+usados+' de '+c.limite+'</b>'+(rest===1 ? ' \u00B7 este \u00E9 o \u00FAltimo envio antes de precisar do Compliance' : '')+'</div>';
}
function contadorTxt(c){ return '<b>Envios entre setores:</b> Jur\u00EDdico \u2192 Filial '+c.envios.juridico+'/'+c.limite+' \u00B7 Filial \u2192 Jur\u00EDdico '+c.envios.filial+'/'+c.limite+(c.limite>LIMITE_ENVIOS ? ' \u00B7 limite ampliado pelo Compliance' : ''); }
function bloqueio(c, lado){
  if (c.libPend) return '<div class="env bloq"><b>Limite de '+c.limite+' envios atingido.</b><br>Libera\u00E7\u00E3o '+(c.libPend.por===lado ? 'solicitada' : 'j\u00E1 solicitada pelo '+(c.libPend.por==='juridico'?'Jur\u00EDdico':'filial'))+' ao Compliance em '+c.libPend.data+'. Aguardando resposta.</div>';
  return '<div class="env bloq"><b>Limite de '+c.limite+' envios atingido.</b><br>Para enviar de novo, o Compliance precisa liberar o reenvio.</div>' +
    '<div class="f" style="margin-top:.5rem"><textarea id="a_lib" placeholder="Por que \u00E9 preciso enviar de novo?"></textarea></div>' +
    '<div class="btns"><button class="btn" onclick="acao(\''+c.id+'\',\'pedir_lib_'+lado+'\')">Solicitar libera\u00E7\u00E3o ao Compliance</button></div>';
}
function libAcaoCompliance(c){
  if (!c.libPend) return '';
  return '<div class="ml-acao" style="background:var(--green-l);border-color:rgba(95,122,69,.35)"><h4>Libera\u00E7\u00E3o de reenvio solicitada</h4>' +
    '<p style="font-size:.72rem;color:var(--txt2);margin-bottom:.5rem">Pedido do <b>'+(c.libPend.por==='juridico'?'Jur\u00EDdico':'ADM da filial')+'</b> em '+c.libPend.data+':<br>"'+esc(c.libPend.motivo)+'"</p>' +

}
function acoes(c){

  if (perfil==='filial') {

      (podeEnviar(c,'filial') ?
        contador(c,'filial') + '<div class="f" style="margin-top:.6rem"><textarea id="a_txt" placeholder="Descreva o que est\u00E1 enviando"></textarea></div><div class="f"><label>Anexos da resposta</label><input type="file" id="a_files" multiple><div class="hint">Documentos pedidos pelo Jur\u00EDdico \u00B7 at\u00E9 20 MB por arquivo.</div></div><div class="btns" style="margin-top:.7rem"><button class="btn pri" onclick="acao(\''+id+'\',\'filial_resp\')">Enviar ao Jur\u00EDdico</button></div>'
        : bloqueio(c,'filial'));
    return '<h4>Acompanhamento</h4><p style="font-size:.76rem;color:var(--txt2)">'+(enc ? 'Caso encerrado. O desfecho fica no hist\u00F3rico.' : 'O Jur\u00EDdico est\u00E1 tratando o caso. Voc\u00EA ser\u00E1 avisado se precisar enviar algo.')+'</p>' +
      (enc ? '' : '<h4>Adicionar informa\u00E7\u00E3o</h4><div class="f"><textarea id="a_txt" placeholder="Ex.: corre\u00E7\u00E3o conclu\u00EDda, fiscal retornou..."></textarea></div><div class="btns"><button class="btn" onclick="acao(\''+id+'\',\'filial_info\')">Adicionar ao hist\u00F3rico</button></div>');
  }
  if (perfil==='juridico') {
    if (enc) return mlAcaoJuridico(c) + '<h4>Caso encerrado</h4><p style="font-size:.76rem;color:var(--txt2)">Desfecho: '+esc(c.desfecho)+'.</p>';
    var h = mlAcaoJuridico(c);
    if (c.status==='aberto') {
      var jur = PERFIS.filter(function(p){ return p.papel==='juridico' && p.ativo!==false; }).map(function(p){ return p.nome || p.email; });
      if (EU && EU.papel==='juridico' && jur.indexOf(EU.nome) < 0) jur.unshift(EU.nome);
      h += '<h4>Novo chamado</h4><div class="f"><label>Quem do Jur\u00EDdico vai fazer a an\u00E1lise? <span class="req">*</span></label>' +
        (jur.length ? '<select id="a_resp"><option value="">Selecione</option>'+opts(jur, EU && EU.papel==='juridico' ? EU.nome : '')+'</select>' : '<input id="a_resp" placeholder="Nome de quem vai analisar">') + '</div>' +
        '<div class="btns"><button class="btn blue" onclick="acao(\''+id+'\',\'assumir\')">Iniciar an\u00E1lise</button></div>';
    } else if (c.respJur) h += '<div class="box" style="margin-top:0"><b>Respons\u00E1vel no Jur\u00EDdico:</b> '+esc(c.respJur)+'</div>';
    h += '<h4>Solicitar \u00E0 filial</h4>' + (podeEnviar(c,'juridico') ?
      contador(c,'juridico') + '<div class="f" style="margin-top:.5rem"><textarea id="a_sol" placeholder="Documentos ou informa\u00E7\u00F5es necess\u00E1rias"></textarea></div>' +
      '<div class="f"><label>Filial deve retornar at\u00E9 <span class="req">*</span></label><input id="a_ret" value="'+prazoRetorno(c, hojeBR(), 2)+'"><div class="hint">'+(c.prazo ? 'Precisa ser antes do prazo do \u00F3rg\u00E3o ('+c.prazo.slice(0,5)+'), para dar tempo de protocolar.' : 'Sem prazo do \u00F3rg\u00E3o registrado: confirme o prazo com a filial.')+'</div></div><div class="btns"><button class="btn" onclick="acao(\''+id+'\',\'solicitar\')">Enviar solicita\u00E7\u00E3o</button></div>'
      : bloqueio(c,'juridico'));
    h += '<h4>Protocolo do \u00F3rg\u00E3o</h4><div class="f"><input id="a_prot" value="'+esc(c.protocolo)+'" placeholder="N\u00BA do protocolo / processo no \u00F3rg\u00E3o"></div><div class="btns"><button class="btn" onclick="acao(\''+id+'\',\'protocolo\')">Salvar protocolo</button></div>';
    h += '<h4>Resposta ao \u00F3rg\u00E3o</h4><div class="btns"><button class="btn" onclick="acao(\''+id+'\',\'responder\')">Registrar resposta protocolada</button></div>';
    h += '<h4>Registrar desfecho</h4><div class="f"><select id="a_desf" onchange="document.getElementById(\'a_mul\').style.display=this.value===\'Multa aplicada\'?\'block\':\'none\'">'+opts(DESFECHOS)+'</select></div>' +
      '<div id="a_mul" style="display:none"><div class="g2"><div class="f"><label>Valor</label><input id="a_mv" placeholder="R$"></div><div class="f"><label>Motivo</label><input id="a_mm"></div></div></div>' +
      '<div class="btns"><button class="btn blue" onclick="acao(\''+id+'\',\'encerrar\')">Encerrar e informar a filial</button></div>';
    return h;
  }

    '<div class="box" style="margin:0 0 .7rem">'+contadorTxt(c)+'</div>' +
    '<div class="f"><label>Pontuar algo no chamado</label><textarea id="a_pont" placeholder="Observa\u00E7\u00E3o, orienta\u00E7\u00E3o ou alerta"></textarea></div>' +
    '<div class="f"><label>Avisar</label><select id="a_dest"><option>Jur\u00EDdico e filial</option><option>Somente Jur\u00EDdico</option><option>Somente filial</option></select></div>' +
    '<div class="btns"><button class="btn green" onclick="acao(\''+id+'\',\'pontuar\')">Registrar pontua\u00E7\u00E3o</button></div>' +
    '<h4>Editar o chamado</h4><div class="btns"><button class="btn" onclick="editando=true;render()">Editar dados</button>' + (enc ? '<button class="btn" onclick="acao(\''+id+'\',\'reabrir\')">Reabrir chamado</button>' : '') + '</div>';
}
function ultimo(c, papel){ for (var i=c.eventos.length-1;i>=0;i--) if (c.eventos[i].papel===papel) return c.eventos[i].texto; return ''; }
function val(id){ var e = $(id); return e ? e.value.trim() : ''; }
function acao(id, tipo){
  var c = byId(id);
  if (tipo==='filial_resp'){ if (c.status!=='aguard_filial') return toast('O Jur\u00EDdico n\u00E3o est\u00E1 aguardando resposta neste chamado.'); if (!podeEnviar(c,'filial')) return toast('Limite de envios atingido.'); if (!val('a_txt')) return toast('Escreva a resposta.'); c.envios.filial++; fecharPendente(c,'filial'); var rj = prazoRetorno(c, hojeBR(), 2); c.retornos.push(rt('filial','juridico', hojeBR(), rj));
    var fsResp = arquivosDe('a_files');
    addEv(c,'filial', 'Envio '+c.envios.filial+'/'+c.limite+' \u00B7 Resposta ao Jur\u00EDdico (Jur\u00EDdico retorna at\u00E9 '+rj.slice(0,5)+'): '+val('a_txt') + (fsResp.length ? ' \u00B7 Anexos: ' + nomesArq(fsResp) : '')); c.status='analise'; toast('Resposta enviada ao Jur\u00EDdico.');
    if (fsResp.length) enviarAnexos(c, fsResp, 'resposta_filial').then(function(n){ toast(n + ' anexo(s) enviado(s) com a resposta.'); render(); }); }
  if (tipo==='pedir_lib_filial' || tipo==='pedir_lib_juridico'){
    var lado = tipo.slice(10); if (!val('a_lib')) return toast('Explique por que precisa enviar de novo.');
    c.libPend = {por:lado, data:hojeBR(), motivo:val('a_lib')}; addEv(c, lado, 'Limite de '+c.limite+' envios atingido. Libera\u00E7\u00E3o solicitada ao Compliance: '+val('a_lib')); toast('Pedido de libera\u00E7\u00E3o enviado ao Compliance.');
  }
  if (tipo==='liberar'){ c._decisaoLib = {id:c.libPend._id, status:'liberada', obs:val('lib_obs')}; c.limite += LIMITE_ENVIOS; addEv(c,'compliance','Reenvio liberado: +'+LIMITE_ENVIOS+' envios para cada setor (novo limite: '+c.limite+')'+(val('lib_obs') ? '. '+val('lib_obs') : '.')); c.libPend = null; toast('Reenvio liberado. A regra de 2 envios continua valendo.'); }
  if (tipo==='nao_liberar'){ if (!val('lib_obs')) return toast('Explique por que n\u00E3o vai liberar.'); c._decisaoLib = {id:c.libPend._id, status:'negada', obs:val('lib_obs')}; addEv(c,'compliance','Reenvio n\u00E3o liberado: '+val('lib_obs')); c.libPend = null; toast('Pedido de reenvio negado.'); }
  if (tipo==='filial_info'){ if (!val('a_txt')) return toast('Escreva a informa\u00E7\u00E3o.'); addEv(c,'filial', val('a_txt')); toast('Informa\u00E7\u00E3o adicionada.'); }
  if (tipo==='assumir'){ var resp = val('a_resp'); if (!resp) return toast('Informe quem do Jur\u00EDdico vai fazer a an\u00E1lise.');
    c.respJur = resp; fecharPendente(c,'juridico'); addEv(c,'juridico','An\u00E1lise iniciada. Respons\u00E1vel no Jur\u00EDdico: ' + resp + '.'); c.status='analise'; toast('Chamado em an\u00E1lise com ' + resp + '.'); }
  if (tipo==='solicitar'){ if (!podeEnviar(c,'juridico')) return toast('Limite de envios atingido.'); if (!val('a_sol')) return toast('Descreva o que a filial deve enviar.');
    var ret = val('a_ret'); if (!/^\d{2}\/\d{2}\/\d{4}$/.test(ret)) return toast('Informe at\u00E9 quando a filial deve retornar (dd/mm/aaaa).');
    if (pBR(ret) < HOJE) return toast('O prazo de retorno n\u00E3o pode estar no passado.');
    if (c.prazo && pBR(ret) >= pBR(c.prazo)) return toast('O retorno da filial precisa ser antes do prazo do \u00F3rg\u00E3o ('+c.prazo.slice(0,5)+').');
    c.envios.juridico++; fecharPendente(c,'juridico'); c.retornos.push(rt('juridico','filial', hojeBR(), ret));
    addEv(c,'juridico','Envio '+c.envios.juridico+'/'+c.limite+' \u00B7 Solicitado \u00E0 filial (retornar at\u00E9 '+ret.slice(0,5)+'): '+val('a_sol')); c.status='aguard_filial'; toast('Solicita\u00E7\u00E3o enviada \u00E0 filial.'); }
  if (tipo==='protocolo'){ var np = val('a_prot'); if (np === (c.protocolo||'')) return toast('Protocolo n\u00E3o foi alterado.');
    addEv(c,'juridico', np ? 'Protocolo do \u00F3rg\u00E3o registrado: ' + np + (c.protocolo ? ' (antes: ' + c.protocolo + ')' : '') + '.' : 'Protocolo do \u00F3rg\u00E3o removido (era ' + c.protocolo + ').'); c.protocolo = np; toast('Protocolo salvo.'); }
  if (tipo==='responder'){ fecharPendente(c,'juridico'); addEv(c,'juridico','Resposta protocolada no \u00F3rg\u00E3o dentro do prazo.'); c.status='respondido'; toast('Resposta registrada.'); }
  if (tipo==='encerrar'){
    var d = val('a_desf');
    if (d==='Multa aplicada'){ var v = parseFloat(val('a_mv').replace(/[^\d,]/g,'').replace(',','.')); if (!v) return toast('Informe o valor da multa.'); c.multa = {valor:v, motivo: val('a_mm') || 'N\u00E3o informado'}; if (c.resultados.indexOf('multa')<0) c.resultados.push('multa'); }
    c.desfecho = d; c.status='encerrado'; fecharPendente(c,'juridico'); fecharPendente(c,'filial'); addEv(c,'juridico','Desfecho: '+d+(c.multa && d==='Multa aplicada' ? ' ('+brl(c.multa.valor)+')' : '')+'. Filial informada.'); toast('Chamado encerrado e filial informada.');
  }
  if (tipo==='pontuar'){ if (!val('a_pont')) return toast('Escreva a pontua\u00E7\u00E3o.'); addEv(c,'compliance','Pontua\u00E7\u00E3o ('+val('a_dest')+'): '+val('a_pont')); toast('Pontua\u00E7\u00E3o registrada e enviada.'); }
  if (tipo==='ml_ok'){
    var vf = parseFloat(val('ml_v').replace(/\./g,'').replace(',','.'));
    if (!vf) return toast('Informe o valor confirmado.');
    c.multaLojista.status = 'confirmada'; c.multaLojista.valorFinal = vf; c.multaLojista.obs = val('ml_obs') ? val('ml_obs') + ' (' + val('ml_base') + ')' : val('ml_base');
    addEv(c,'juridico','Multa contratual ao lojista '+c.lojista+' confirmada: '+brl(vf)+' ('+val('ml_base')+'). Filial orientada a notificar o lojista.'); toast('Multa ao lojista confirmada.');
  }
  if (tipo==='ml_nao'){
    if (!val('ml_obs')) return toast('Explique por que a multa n\u00E3o ser\u00E1 aplicada.');
    c.multaLojista.status = 'nao_aplicada'; c.multaLojista.obs = val('ml_obs');
    addEv(c,'juridico','Multa contratual ao lojista n\u00E3o aplicada: '+val('ml_obs')); toast('Registrado: multa n\u00E3o aplicada.');
  }
  if (tipo==='reabrir'){ c.status='analise'; c.desfecho=''; addEv(c,'compliance','Chamado reaberto pelo Compliance.'); toast('Chamado reaberto.'); }
  persistir(id);
  render();
}
function salvarEdicao(id){
  var c = byId(id), mud = [];
  var set = function(campo, nome, novo){ if (String(c[campo]) !== String(novo)) { mud.push(nome+': "'+(c[campo]||'\u2014')+'" \u2192 "'+(novo||'\u2014')+'"'); c[campo] = novo; } };
  var np = val('e_prazo'); if (np && !/^\d{2}\/\d{2}\/\d{4}$/.test(np)) return toast('Prazo do \u00F3rg\u00E3o deve estar no formato dd/mm/aaaa.');
  set('orgao','\u00D3rg\u00E3o', val('e_orgao')); set('motivo','Motivo', val('e_motivo')); set('prazo','Prazo', np); set('protocolo','Protocolo do \u00F3rg\u00E3o', val('e_protocolo')); set('relato','Relato', val('e_relato'));
  var st = val('e_status'); if (st !== c.status) { mud.push('Status: '+STATUS[c.status]+' \u2192 '+STATUS[st]); c.status = st; }
  var ncs = [].map.call(document.querySelectorAll('.e_nc:checked'), function(i){ return i.value; });
  if (ncs.join('|') !== c.ncs.join('|')) { mud.push('N\u00E3o conformidades atualizadas'); c.ncs = ncs; }
  editando = false;
  if (mud.length) { addEv(c,'compliance','Editou o chamado \u2014 '+mud.join('; ')); persistir(id); toast('Altera\u00E7\u00F5es salvas e registradas no hist\u00F3rico.'); } else toast('Nada foi alterado.');
  render();
}
function bindDetalhe(){
  [].forEach.call(document.querySelectorAll('.e_nc'), function(i){ i.addEventListener('change', function(){ i.parentNode.classList.toggle('on', i.checked); }); });
}

[].forEach.call(document.querySelectorAll('#perfis button'), function(b){ b.onclick = function(){ go(b.getAttribute('data-p')); }; });
